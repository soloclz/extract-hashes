[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-hashes"
version = "0.1.0"
description = "Extract and classify hexadecimal hash candidates from text evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "soloclz" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
extract-hashes = "extract_hashes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_hashes"]
